    { name = "docx", text = "󰈬", fg = "#C8C8C8" },

    { name = "xls",  text = "󰈛", fg = "#C8C8C8" },
    { name = "xlsx", text = "󰈛", fg = "#C8C8C8" },

    { name = "ppt",  text = "󰈧", fg = "#C8C8C8" },
    { name = "pptx", text = "󰈧", fg = "#C8C8C8" },



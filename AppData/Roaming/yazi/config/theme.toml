    { name = "tsx",  text = "", fg = "#C8C8C8" },

    { name = "html", text = "", fg = "#C8C8C8" },
    { name = "css",  text = "", fg = "#C8C8C8" },
    { name = "scss", text = "", fg = "#C8C8C8" },

    { name = "rs",   text = "", fg = "#C8C8C8" },

    { name = "go",   text = "", fg = "#C8C8C8" },

    { name = "c",    text = "", fg = "#C8C8C8" },
    { name = "h",    text = "", fg = "#B8B8B8" },
    { name = "cpp",  text = "", fg = "#C8C8C8" },
    { name = "hpp",  text = "", fg = "#B8B8B8" },

    { name = "java", text = "", fg = "#C8C8C8" },

    { name = "cs",   text = "󰌛", fg = "#C8C8C8" },

    { name = "php",  text = "", fg = "#C8C8C8" },


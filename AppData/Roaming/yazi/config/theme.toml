# ---------------------------------------------------------
# Fallback
# ---------------------------------------------------------

conds = [

    # Broken symlink
    { if = "orphan", text = "", fg = "#707070" },

    # Symlink
    { if = "link", text = "", fg = "#989898" },

    # 当前 hover 的目录用“打开文件夹”
    { if = "dir & hovered", text = "", fg = "#E8E8E8" },

    # 普通目录
    { if = "dir", text = "", fg = "#D8D8D8" },

    # Executable
    { if = "exec", text = "", fg = "#D0D0D0" },

    # 普通文件 fallback
    { if = "!dir", text = "", fg = "#B8B8B8" },
]

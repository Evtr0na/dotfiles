gui:
  language: "en"
  # Iosevka Nerd Font 的话可以开
  # nerdFontsVersion: "3"

  border: bold

  theme:
    activeBorderColor:
      - '#f2cdcd'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#f2cdcd'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'

  authorColors:
    '*': '#b4befe'






# 不显示第一次启动之类的介绍 popup
disableStartupPopups: true

# 顶层按 Esc 时直接退出 lazygit
quitOnTopLevelReturn: true

# 非 git 目录启动时仍然问你怎么办
notARepository: prompt

# 退出不用再确认
confirmOnQuit: false

os:
  editPreset: "nvim"
